<style>
:root{--bg:#fff3b0;--ink:#5a2a54}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;background:var(--bg);color:var(--ink);font-family:'Baloo 2','Trebuchet MS',sans-serif;font-weight:700;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0}

#shelf{left:20px;top:58px;width:620px;height:70px}
#shelf::after,#ishelf::after{content:"";position:absolute;left:-8px;right:-8px;bottom:-10px;height:16px;background:#6b3f23;border-radius:5px;box-shadow:0 4px 0 #0003}
.si{position:absolute;top:8px;width:94px;height:50px;display:flex;align-items:center;gap:6px;padding-left:10px;font-size:19px;color:#fff;text-shadow:0 2px 0 #4b2a10;touch-action:none;cursor:grab}
.lock{position:absolute;top:18px;width:94px;text-align:center;font-size:20px;opacity:.35}
.ctop{left:0;top:196px;width:780px;height:40px;background:#ffc2df;border-radius:0 18px 0 0;z-index:2}

.awn{left:0;top:0;width:1024px;height:50px;background:repeating-linear-gradient(90deg,#ff5fa2 0 40px,#fff 40px 80px);border-radius:0 0 22px 22px;z-index:5}
#ksvg{left:0;top:0;width:1024px;height:720px;z-index:3;pointer-events:none}
.hit{pointer-events:auto}
#me,.hp{width:64px;z-index:1}

.hp.drag{cursor:grab;touch-action:none}
.wp{position:absolute;top:-20px;left:6px;width:52px;height:10px;background:#fff;border:2px solid #5a2a54;border-radius:6px;overflow:hidden}
.wp i{display:block;height:100%;width:0;background:#ff7eb6}
.till{width:72px;height:56px;top:168px;z-index:3;cursor:pointer}
.till .lamp{fill:#999}.till.on .lamp{fill:#2ee66b}
#a2{display:none}
.c{position:absolute;pointer-events:auto}
.bob{display:block}
.walking .bob{animation:bob .32s infinite alternate ease-in-out}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-5px) rotate(2deg)}}
.lbl{position:absolute;top:4px;display:flex;align-items:center;gap:4px;background:#fff;border:2px solid #5a2a54;border-radius:10px;padding:1px 6px;font-size:12px;white-space:nowrap}
.lbl.vip{background:#ffe27a;border-color:#b8860b}
.tm{position:relative;width:46px;height:13px;background:#eee;border-radius:7px;overflow:hidden;border:1px solid #5a2a54}
.tm i{position:absolute;left:0;top:0;bottom:0;background:#4cd68a;transition:width .2s linear}
.tm b{position:relative;font-size:10px;line-height:11px;display:block;text-align:center}
.c.no{animation:sh .35s}
@keyframes sh{25%{margin-left:-8px}75%{margin-left:8px}}
.pop{z-index:8;font-size:26px;pointer-events:none;white-space:nowrap;animation:up 1.2s forwards;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.hud{top:7px;z-index:7;display:flex;align-items:center;gap:6px;height:38px}
.pill{background:#fff;border-radius:20px;padding:0 12px;font-size:17px;line-height:36px;height:38px;box-shadow:0 3px 0 #e9c46a;white-space:nowrap}
.pill.rush{background:#ff4d4d;color:#fff;box-shadow:0 3px 0 #a31d1d;animation:pulse .8s infinite alternate}
.pill.pz{background:#8be0ff;box-shadow:0 3px 0 #3a9bc4}
@keyframes pulse{to{transform:scale(1.06)}}
.btn{background:#fff;border-radius:16px;padding:4px 12px;box-shadow:0 4px 0 #e9a8c8}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e9a8c8}
.bdg{background:#ff4d4d;color:#fff;border-radius:12px;padding:0 6px;font-size:13px;margin-left:4px}
#orders{right:12px;top:6px;background:#fff;border:3px solid #ff7eb6;border-radius:12px;padding:0 10px;z-index:7;display:flex;align-items:center;gap:8px;font-size:16px;height:40px}
#orders i{display:flex;align-items:center;gap:2px;font-style:normal}
#claim{right:12px;top:52px;z-index:7;display:none;background:#ffd93d;border-radius:16px;padding:4px 14px;box-shadow:0 4px 0 #b8860b;font-size:18px;animation:pulse .8s infinite alternate}
#hint{left:0;bottom:0;width:1024px;height:22px;line-height:22px;font-size:14px;z-index:6;color:#fff;background:#5a2a54aa;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px}
#banner{left:0;right:0;top:250px;z-index:9;text-align:center;font-size:96px;font-weight:800;color:#fff;text-shadow:0 6px 0 #c01616,0 0 24px #ff4d4d;pointer-events:none;display:none;animation:ban 3.2s forwards}
@keyframes ban{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}85%{opacity:1}100%{transform:scale(1.1);opacity:0}}
#cd{left:0;top:300px;width:1024px;text-align:center;font-size:64px;color:#fff;text-shadow:0 5px 0 #5a2a54;z-index:85;display:none;pointer-events:none}
#afk{left:0;top:0;width:1024px;height:720px;z-index:90;background:#3c1446dd;color:#fff;font-size:48px;text-align:center;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.ghost{position:fixed;z-index:50;pointer-events:none}
/* ice cream shop */
.iwall{left:0;top:0;width:1024px;height:720px;background:repeating-linear-gradient(90deg,#c8f5e8 0 48px,#e8fcf5 48px 96px);z-index:0}
.ifloor{left:0;top:312px;width:1024px;height:408px;background:#7fa8ff;z-index:0}
.iback{left:0;top:176px;width:1024px;height:22px;background:#cfe8ff;border-bottom:6px solid #9ec3ee;z-index:0}
.ictop{left:0;top:246px;width:1024px;height:34px;background:#fff0c9;z-index:2}
.icfront{left:0;top:280px;width:1024px;height:32px;background:#4cd0b0;border-bottom:6px solid #2a9b80;z-index:2}
.iawn{left:0;top:0;width:1024px;height:50px;background:repeating-linear-gradient(90deg,#4cd0b0 0 40px,#fff 40px 80px);border-radius:0 0 22px 22px;z-index:5}
#ishelf{left:20px;top:58px;width:360px;height:64px}
.ci{position:absolute;top:4px;width:106px;height:54px;display:flex;align-items:center;gap:4px;color:#fff;text-shadow:0 2px 0 #4b2a10;font-size:15px;line-height:15px;cursor:pointer;touch-action:none}
#hand{left:400px;top:58px;width:340px;height:64px;background:#fff;border:3px solid #4cd0b0;border-radius:12px;display:flex;align-items:center;gap:8px;padding:2px 8px;font-size:14px;line-height:16px;z-index:6;text-align:left}
#handicon{position:relative;width:44px;height:56px;flex:none;touch-action:none}
#handicon.go{cursor:grab;filter:drop-shadow(0 0 6px #ffd93d)}
.spoon{position:absolute;right:-6px;top:0;width:18px;height:18px;border-radius:50%;border:2px solid #5a2a54}
#itubs{left:0;top:0;width:1024px;height:220px;z-index:2;pointer-events:none}
.tubi{position:absolute;top:128px;width:120px;height:54px;pointer-events:auto;cursor:pointer;touch-action:none}
.tb{position:absolute;left:8px;right:8px;bottom:-9px;height:8px;background:#fff;border:1px solid #5a2a54;border-radius:4px;overflow:hidden}

function sw(t,c){return t==='a'?`<svg width="44" height="44" viewBox="0 0 44 44"><rect x="8" y="4" width="28" height="36" rx="8" fill="${c}" stroke="#0003"/></svg>`:
 c?`<svg width="48" height="44" viewBox="0 0 60 30"><g fill="${c}" stroke="#0003"><circle cx="18" cy="12" r="9"/><circle cx="42" cy="12" r="9"/><circle cx="30" cy="8" r="10"/><rect x="16" y="14" width="28" height="12" rx="3"/></g></svg>`:'<div style="height:44px;line-height:44px">none</div>'}
function cos(list,t){return list.map(([id,c,cost])=>{const own=S.own.includes(t+':'+id),on=S[t]===id;
 return `<div class="it ${on?'on':''}">${sw(t,c)}<div>${id}</div><button onclick="pickIt('${t}','${id}',${cost})">${on?'Wearing ✓':own?'Wear':'Buy '+cost+' ⭐'}</button></div>`}).join('')}
const card=(ic,name,sub,btn)=>`<div class="it"><div style="font-size:28px;height:38px">${ic}</div><div>${name}</div><div style="font-size:12px;line-height:14px">${sub}</div>${btn}</div>`;
const btnB=(dis,txt,fn)=>`<button ${dis?'disabled':''} onclick="${fn}">${txt}</button>`;
function upCot(){let h='';
 ['green','purple','white'].forEach(n=>{const own=S.cols.includes(n);h+=card(candy(n,26),n+' candy','pays '+PAY[n]+' ⭐',btnB(own,own?'In cabinet ✓':'Buy '+COLP[n]+' ⭐',`buy('col','${n}',${COLP[n]})`))});
 h+=card('🌀','Faster spinning','',btnB(S.spin>1,S.spin>1?'Max ✓':'Level '+(S.spin+1)+': '+SPINP[S.spin]+' ⭐',`buy('spin','',${SPINP[S.spin]||0})`));
 h+=card('⏳','Patience +5s','',btnB(S.pat>1,S.pat>1?'Max ✓':'Level '+(S.pat+1)+': '+PATP[S.pat]+' ⭐',`buy('pat','',${PATP[S.pat]||0})`));return h}
function upIce(){let h='';
 if(cur==='ice'){IF.slice(3).forEach(f=>{const own=S.iceFl.includes(f[0]);h+=card(iceIcon('cone',[f[0]],24),f[4],'pays '+f[2]+' ⭐',btnB(own,own?'On the counter ✓':'Buy '+f[3]+' ⭐',`buy('fl','${f[0]}',${f[3]})`))});
  h+=card(iceIcon('double',['strawberry','vanilla'],24),'Double cone','2 scoops · +3 ⭐',btnB(S.dbl,S.dbl?'Unlocked ✓':'Buy 75 ⭐',`buy('dbl','',75)`))}
 else if(cur==='pancake'){PNT.filter(f=>f[3]>0).forEach(f=>{const own=S.bk.pancake.tp.includes(f[0]);h+=card(pTopIcon(f[0],30),f[1],'adds '+f[2]+' ⭐',btnB(own,own?'On the bar ✓':'Buy '+f[3]+' ⭐',`buy('tp','${f[0]}',${f[3]})`))})}
 else if(cur==='froyo'){FYF.filter(f=>f[2]>0).forEach(f=>{const own=S.bk.froyo.fl.includes(f[0]);h+=card(yoIcon('S',[f[0]],[],30),f[1]+' yogurt','+'+f[4]+' ⭐ per scoop',btnB(own,own?'On the wall ✓':'Buy '+f[2]+' ⭐',`buy('fl','${f[0]}',${f[2]})`))});
  FYT.filter(f=>f[2]>0).forEach(f=>{const own=S.bk.froyo.tp.includes(f[0]);h+=card(`<div style="width:26px;height:26px;border-radius:50%;background:${f[3]};margin:auto;border:2px solid #5a2a54"></div>`,f[1],'+1 ⭐ each',btnB(own,own?'On the bar ✓':'Buy '+f[2]+' ⭐',`buy('tp','${f[0]}',${f[2]})`))})}
 else if(cur==='bubble'){BT.teas.filter(f=>f[3]>0).forEach(f=>{const own=S.bk.bubble.fl.includes(f[0]);h+=card(drinkIcon(f[0],[],24),f[1]+' tea','pays '+f[2]+' ⭐',btnB(own,own?'On the machine ✓':'Buy '+f[3]+' ⭐',`buy('fl','${f[0]}',${f[3]})`))});
  BT.tops.filter(f=>f[3]>0).forEach(f=>{const own=S.bk.bubble.tp.includes(f[0]);h+=card(topIcon(f[0],30),f[1],'adds '+f[2]+' ⭐',btnB(own,own?'In the bar ✓':'Buy '+f[3]+' ⭐',`buy('tp','${f[0]}',${f[3]})`))})}
 else BK[cur].fl.filter(f=>f[3]>0).forEach(f=>{const own=S.bk[cur].fl.includes(f[0]);h+=card(bakeIcon(cur,f[0],30),f[1],'pays '+f[2]+' ⭐ each',btnB(own,own?'Unlocked ✓':'Buy '+f[3]+' ⭐',`buy('fl','${f[0]}',${f[3]})`))});
 const sp=gSpd(cur),cs=SPC[cur];h+=card('⚡','Helper speed','now '+IHF[sp]+'x',btnB(sp>3,sp>3?'Max ✓':'Level '+(sp+1)+': '+cs[sp]+' ⭐',`buy('ihs','',${cs[sp]||0})`));return h}
function hireCot(){return card('🧾','Cashier','2nd till · drag to change jobs',btnB(S.cashier,S.cashier?'Hired ✓':'Hire 20 ⭐',`hire('cashier',20)`))+card('🌀','Candy winder','makes candy · drag to change jobs',btnB(S.winder,S.winder?'Hired ✓':'Hire 20 ⭐',`hire('winder',20)`))}
function hireIce(){const c=HC[cur];return [1,2].map(n=>card('🧑‍🍳','Helper '+n,'works at till '+(n+1),btnB(gH(cur,n),gH(cur,n)?'Hired ✓':'Hire '+c+' ⭐',`hireN(${n})`))).join('')}
function hireN(n){const c=HC[cur];if(S.c<c){alert('You need '+c+' ⭐ tokens. Keep selling!');return}S.c-=c;sH(cur,n,true);fillNames();save();drawHelpers();hud();openShop();askName(nameKey(cur,n),'Name your new helper! 🧑‍🍳')}
function rushHTML(){if(!RS.cotton.on)return '';
 const b=(k,perm,icon,name,txt)=>`<div class="it rushit"><div style="font-size:28px">${icon}</div><div>${name}</div><div style="font-size:12px">${txt}</div><button ${perm||RS.cotton[k]?'disabled':''} onclick="rushHire('${k}')">${perm?'Already hired ✓':RS.cotton[k]?'Helping now ✓':'Borrow 10 ⭐'}</button></div>`;
 return `<h3 style="color:#c01616">🚨 Rush hour helpers (until rush ends)</h3><div class="grid">${b('cash',S.cashier,'🧾','Rush cashier','2nd till')}${b('wind',S.winder,'🌀','Rush winder','makes candy')}</div>`}
function pauseHTML(){return `<h3>⏸ Break time</h3><div class="grid">${card('⏸','Pause customers','5 minutes · helpers keep working and also wind candy',btnB(breakT>0,breakT>0?'Paused '+mmss(breakT):'100 ⭐','pauseBreak()'))}</div>`}
function pauseBreak(){if(S.c<100){alert('You need 100 ⭐ tokens.');return}S.c-=100;breakT=300;save();hud();openShop()}
function hire(k,cost){if(S.c<cost){alert('You need '+cost+' ⭐ tokens. Keep selling!');return}S.c-=cost;S[k]=true;fillNames();save();drawHelpers();hud();openShop();askName(k==='cashier'?'cashier':'winder','Name your new helper! 🧑‍🍳')}
function rushHire(k){if(S.c<10){alert('You need 10 ⭐ tokens!');return}S.c-=10;RS.cotton[k]=true;save();drawHelpers();hud();openShop()}
function buy(k,n,cost){if(S.c<cost){alert('You need '+cost+' ⭐ tokens. Keep selling!');return}S.c-=cost;
 if(k==='col')S.cols.push(n);else if(k==='fl')(cur==='ice'?S.iceFl:S.bk[cur].fl).push(n);else if(k==='tp')S.bk[cur].tp.push(n);else if(k==='dbl')S.dbl=true;else if(k==='ihs')iSpd(cur);else S[k]++;
 save();hud();if(cur==='cotton')drawK();else if(cur==='ice')drawIce();else if(cur==='bubble')drawBubble();else if(cur==='pancake')drawPancake();else if(cur==='froyo')drawFroyo();else drawBake();openShop()}
function pickIt(t,id,cost){const key=t+':'+id;
 if(!S.own.includes(key)){if(S.c<cost){alert('You need '+cost+' ⭐ tokens. Keep selling!');return}S.c-=cost;S.own.push(key)}
 S[t]=id;save();hud();drawMe();openShop()}
function openShop(){paused=true;$('tk').textContent='You have ⭐ '+S.c+'  (game paused)';
 $('rushsec').innerHTML=cur==='cotton'?rushHTML()+pauseHTML():'';
 $('ug').innerHTML=cur==='cotton'?upCot():upIce();$('hire').innerHTML=cur==='cotton'?hireCot():hireIce();
 $('ag').innerHTML=cos(APR,'a');$('hg').innerHTML=cos(HAT,'h');$('shop').classList.remove('hide')}
function shopX(){paused=false;$('shop').classList.add('hide')}
function swap(){S.g=S.g==='girl'?'boy':'girl';save();drawMe()}
function begin(g){S.g=g;save();$('start').classList.add('hide');fit();paused=false;idle=0;enterShop('cotton')}
$('pg').innerHTML=meSvg('girl','#ff7eb6',null,70);
$('pb').innerHTML=meSvg('boy','#ff7eb6',null,70);
fillNames();fit();setInterval(tick,200);
if(S.g){begin(S.g)}
</script>
</body>
