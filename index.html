<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3b0;--ink:#5a2a54}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;background:var(--bg);color:var(--ink);font-family:'Baloo 2','Trebuchet MS',sans-serif;font-weight:700;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#stage{position:fixed;inset:0;touch-action:none}
#scene{position:absolute;left:0;top:0;width:1024px;height:720px;transform-origin:0 0;overflow:hidden;background:repeating-linear-gradient(90deg,#b9e6ff 0 48px,#dff3ff 48px 96px)}
#scene>*{position:absolute}
.floor{left:0;top:395px;width:1024px;height:325px;background:#b79cff}
.ctop{left:0;top:270px;width:782px;height:66px;background:#ffc2df;border-radius:0 24px 0 0;z-index:2}
.cfront{left:0;top:336px;width:782px;height:59px;background:#ff9ecf;border-bottom:8px solid #d9609c;border-radius:0 0 0 0;z-index:2}
.awn{left:0;top:0;width:1024px;height:52px;background:repeating-linear-gradient(90deg,#ff5fa2 0 40px,#fff 40px 80px);border-radius:0 0 22px 22px;z-index:5}
#ksvg{left:0;top:0;width:1024px;height:720px;z-index:3;pointer-events:none}
.hit{pointer-events:auto}
#me{width:80px;z-index:1;touch-action:none;cursor:grab}
#cc{left:0;top:0;width:1024px;height:720px;pointer-events:none;z-index:4}
.c{position:absolute;top:425px;width:64px;pointer-events:auto}
.bob{display:block}
.walking .bob{animation:bob .32s infinite alternate ease-in-out}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-5px) rotate(2deg)}}
.tm{position:absolute;top:-46px;left:-4px;width:72px;height:15px;background:#fff;border:2px solid #5a2a54;border-radius:8px;overflow:hidden}
.tm i{position:absolute;left:0;top:0;bottom:0;background:#4cd68a;transition:width .2s linear}
.tm b{position:relative;font-size:11px;line-height:11px;display:block;text-align:center}
.lab{position:absolute;top:-64px;left:-2px;width:68px;background:#ffd93d;border:2px solid #b8860b;border-radius:8px;font-size:12px;line-height:14px;text-align:center}
.bub{position:absolute;top:-32px;left:50%;transform:translateX(-50%);background:#fff;border-radius:10px;padding:0 8px;border:2px solid #5a2a54;height:30px;display:flex;align-items:center;font-size:16px}
.c.no{animation:sh .35s}
@keyframes sh{25%{margin-left:-8px}75%{margin-left:8px}}
.pop{z-index:8;font-size:26px;pointer-events:none;white-space:nowrap;animation:up 1.2s forwards;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.hud{top:7px;z-index:7;display:flex;align-items:center;gap:8px;height:38px}
.pill{background:#fff;border-radius:20px;padding:0 14px;font-size:20px;line-height:36px;height:38px;box-shadow:0 3px 0 #e9c46a}
.btn{background:#fff;border-radius:16px;padding:4px 14px;box-shadow:0 4px 0 #e9a8c8}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e9a8c8}
#orders{right:12px;top:7px;background:#fff;border:3px solid #ff7eb6;border-radius:12px;padding:0 10px;z-index:7;display:flex;align-items:center;gap:6px;font-size:16px;height:38px}
#orders i{display:flex;border-radius:8px;padding:0 3px}
#orders i.v{background:#ffe27a;outline:2px solid #e0a800}
#chips{left:14px;bottom:12px;width:640px;display:flex;gap:8px;z-index:6}
.chip{border-radius:18px;padding:4px 10px 6px;min-width:88px;box-shadow:0 5px 0 rgba(0,0,0,.2);touch-action:none;cursor:grab;font-size:17px;border:2px solid #5a2a5433;text-align:center}
.chip svg{margin:0 auto}
.ghost{position:fixed;z-index:50;pointer-events:none}
#hint{left:670px;bottom:14px;width:340px;height:70px;font-size:16px;line-height:19px;z-index:6;overflow:hidden;color:#fff;text-shadow:0 2px 0 #5a2a54}
.ov{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:30px 14px;text-align:center}
.ov.hide{display:none}
.pick{display:flex;justify-content:center;gap:16px;margin-top:14px}
.pick button{background:#fff;border-radius:22px;padding:12px 18px;font-size:22px;box-shadow:0 6px 0 #e9a8c8}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0 16px}
.it{background:#fff;border-radius:16px;padding:8px;width:124px;font-size:15px}
.it button{margin-top:4px;border-radius:12px;padding:2px 8px;background:#ffd93d}
.it.on button{background:#9be28f}
.it button:disabled{background:#ddd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff3b0}}
:root[data-theme="dark"]{--bg:#fff3b0}
</style>
</head>
<body>
<div id="stage"><div id="scene"><div class="floor"></div><div class="ctop"></div><div class="cfront"></div><div class="awn"></div>
<svg id="ksvg" viewBox="0 0 1024 720"></svg>
<div id="me"></div><div id="cc"></div>
<div class="hud" style="left:12px"><span class="pill">🍭 Cotton Candy Shop</span><span class="pill" id="coin">⭐ 0</span><button class="btn" style="font-size:19px" onclick="openShop()">🛍️ Shop</button></div>
<div id="orders"></div><div id="chips"></div><div id="hint"></div></div></div>

<div class="ov" id="start"><h1 style="font-size:36px;margin:20px 0 6px">🍭 Cotton Candy Shop</h1><p style="font-size:22px">Pick your character!</p><div class="pick"><button onclick="begin('girl')"><div id="pg"></div>Girl</button><button onclick="begin('boy')"><div id="pb"></div>Boy</button></div></div>
<div class="ov hide" id="shop"><h2 style="margin:6px">Shop</h2><div id="tk" style="font-size:20px"></div>
<h3>Upgrades</h3><div class="grid" id="ug"></div><h3>Aprons</h3><div class="grid" id="ag"></div><h3>Chef hats</h3><div class="grid" id="hg"></div>
<button class="btn" onclick="swap()">Switch girl / boy</button> <button class="btn" onclick="shopX()">Back to the game 🍭</button></div>

<script>
const COLS=[['pink','#ff7eb6'],['blue','#5ab8ff'],['yellow','#ffd93d'],['green','#4cd68a'],['purple','#b07cff'],['white','#ffffff']],HEX=Object.fromEntries(COLS);
const APR=[['pink','#ff7eb6',0],['blue','#4aa8f5',6],['yellow','#ffd93d',6],['purple','#9b6bd6',6]];
const HAT=[['none',null,0],['white','#ffffff',8],['pink','#ff9ecf',8],['blue','#7cc4ff',8],['yellow','#ffe066',8]];
const COLP={green:15,purple:25,white:40},SPIN=[3,2,1.5],SPINP=[20,40],PAT=[60,70,80],PATP=[30,50];
const SK=['#f6d3b3','#e0ac84','#b97a56','#8d5a3b'],CL=['#e85d75','#4f9bd9','#6cc070','#f08c3a','#2bb3a8','#d94f4f','#ffd93d'];
const R=a=>a[Math.random()*a.length|0];
let S={c:0,g:null,a:'pink',h:'none',own:['a:pink','h:none'],cols:['pink','blue','yellow'],spin:0,pat:0,stock:{pink:0,blue:0,yellow:0,green:0,purple:0,white:0}};
try{const x=JSON.parse(localStorage.getItem('ccshop3'));if(x){const st=Object.assign({},S.stock,x.stock);S=Object.assign(S,x);S.stock=st}}catch(e){}
function save(){try{localStorage.setItem('ccshop3',JSON.stringify(S))}catch(e){}}
const sc=document.getElementById('scene'),stage=document.getElementById('stage'),me_=document.getElementById('me'),ks=document.getElementById('ksvg'),cc=document.getElementById('cc');
let sf=1,cu=[],nid=0,gt=0,nextSp=1,lastVip=0,paused=true,auto=false,mv=0;
const K={powder:null,prog:0,open:false,drag:false,last:0,a:0},P={x:300,y:100},CX=590,CY=304;
const STN={cupboard:[705,100],tray:[550,100]};
function fit(){const w=innerWidth,h=innerHeight;sf=Math.min(w/1024,h/720);sc.style.transform=`translate(${(w-1024*sf)/2}px,${(h-720*sf)/2}px) scale(${sf})`}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
const toL=e=>{const r=sc.getBoundingClientRect();return[(e.clientX-r.left)/sf,(e.clientY-r.top)/sf]};
function person(o,w,top){
 const hc=o.hc||'#3b2a20',h=o.hair,L='stroke="#5a2a54" stroke-opacity=".5"';
 let s=`<svg width="${w}" viewBox="0 ${top} 60 ${110-top}" style="display:block">`;
 s+=`<rect x="18" y="84" width="9" height="24" rx="3" fill="${o.pants}"/><rect x="33" y="84" width="9" height="24" rx="3" fill="${o.pants}"/>`;
 s+=`<rect x="12" y="44" width="36" height="44" rx="10" fill="${o.shirt}" ${L}/><rect x="4" y="48" width="9" height="30" rx="4" fill="${o.shirt}" ${L}/><rect x="47" y="48" width="9" height="30" rx="4" fill="${o.shirt}" ${L}/>`;
 if(o.suit)s+=`<path d="M24 44l6 16 6-16z" fill="#fff"/><path d="M29 50h2l2 14-3 4-3-4z" fill="#d62839"/><path d="M12 50l12-6 6 16-10 10z M48 50l-12-6-6 16 10 10z" fill="#1c1f33" opacity=".45"/>`;
 if(o.apron)s+=`<rect x="16" y="54" width="28" height="36" rx="6" fill="${o.apron}" ${L}/>`;
 if(h==='long')s+=`<rect x="12" y="22" width="8" height="32" rx="4" fill="${hc}"/><rect x="40" y="22" width="8" height="32" rx="4" fill="${hc}"/>`;
 s+=`<circle cx="30" cy="26" r="16" fill="${o.skin}" stroke="#5a2a54" stroke-width="1.5"/>`;
 if(h!=='none')s+=`<path d="M13 28a17 17 0 0 1 34 0q-17-9-34 0z" fill="${hc}"/>`;
 if(h==='bun')s+=`<circle cx="30" cy="8" r="7" fill="${hc}"/>`;
 if(o.hat)s+=`<g fill="${o.hat}" stroke="#0004"><circle cx="20" cy="2" r="9"/><circle cx="40" cy="2" r="9"/><circle cx="30" cy="-4" r="10"/><rect x="18" y="4" width="24" height="10" rx="3"/></g>`;
 return s+'</svg>';
}
function candy(c,w){return `<svg width="${w}" height="${w*1.3}" viewBox="0 0 30 40" style="display:block"><rect x="13" y="20" width="4" height="19" rx="2" fill="#e8c9a0"/><circle cx="15" cy="13" r="12" fill="${HEX[c]||c}" stroke="#0003"/><circle cx="10" cy="9" r="4" fill="#fff8"/></svg>`}
function meSvg(g,a,h,w){return person({skin:'#f6d3b3',hair:g==='girl'?'long':'short',hc:'#6b3f23',shirt:g==='girl'?'#7be0c3':'#ff9f6b',pants:'#4a5a8a',apron:a,hat:h},w,-14)}
/* helper: walk + drag (anywhere behind the counter) */
function setP(x,y){P.x=x;P.y=y;me_.style.left=x+'px';me_.style.top=y+'px'}
const isAt=n=>Math.hypot(P.x-STN[n][0],P.y-STN[n][1])<95;
function goTo(n,cb){
 if(isAt(n)&&!auto){cb&&cb();return}
 const[x,y]=STN[n],t=++mv,d=Math.max(.3,Math.hypot(x-P.x,y-P.y)/320);auto=true;
 me_.style.transition=`left ${d}s linear,top ${d}s linear`;me_.style.left=x+'px';me_.style.top=y+'px';me_.classList.add('walking');
 setTimeout(()=>{if(t!==mv)return;auto=false;me_.style.transition='none';me_.classList.remove('walking');setP(x,y);cb&&cb()},d*1000)}
const clampP=(x,y)=>[Math.min(712,Math.max(8,x)),Math.min(118,Math.max(66,y))];
let dragP=null;
me_.addEventListener('pointerdown',e=>{if(paused)return;mv++;auto=false;const[lx,ly]=toL(e),cs=getComputedStyle(me_);
 setP(parseFloat(cs.left)||P.x,parseFloat(cs.top)||P.y);me_.style.transition='none';me_.classList.remove('walking');
 dragP=[lx-P.x,ly-P.y];me_.setPointerCapture(e.pointerId);e.preventDefault()});
me_.addEventListener('pointermove',e=>{if(!dragP)return;const[lx,ly]=toL(e),[x,y]=clampP(lx-dragP[0],ly-dragP[1]);
 if(Math.hypot(x-P.x,y-P.y)>1)me_.classList.add('walking');setP(x,y)});
['pointerup','pointercancel'].forEach(t=>me_.addEventListener(t,()=>{dragP=null;me_.classList.remove('walking')}));
function drawMe(){const a=APR.find(x=>x[0]===S.a)[1],h=HAT.find(x=>x[0]===S.h)[1];me_.innerHTML='<div class="bob">'+meSvg(S.g||'girl',a,h,80)+'</div>'}
/* hud */
function say(t,ms){const h=document.getElementById('hint');h.textContent=t;if(ms)setTimeout(()=>{if(h.textContent===t)hint()},ms)}
function hint(){say('Drag candy onto a customer. To make candy: tap the cabinet, pick a powder, then spin the silver tray!')}
function hud(){document.getElementById('coin').textContent='⭐ '+S.c;
 document.getElementById('chips').innerHTML=S.cols.map(c=>`<div class="chip" data-c="${c}" style="background:${HEX[c]}">${candy(c,24)}${c} ×${S.stock[c]}</div>`).join('');
 document.getElementById('orders').innerHTML='Orders '+(cu.filter(c=>c.state!=='leave').map(c=>`<i class="${c.vip?'v':''}">${candy(c.o,16)}</i>`).join('')||'—')}
function pop(t,color,x,y){const p=document.createElement('div');p.className='pop';p.textContent=t;p.style.color=color;p.style.left=x+'px';p.style.top=y+'px';sc.appendChild(p);setTimeout(()=>p.remove(),1200)}
/* customers: walk in from the left, leave on the right */
const slotX=i=>600-i*100;
function spawn(vip){
 const free=[0,1,2].find(i=>!cu.some(c=>c.state!=='leave'&&c.slot===i));if(free==null)return false;
 const o=R(S.cols),t=vip?20:PAT[S.pat];
 const l=vip?{skin:R(SK),hair:R(['none','short']),hc:'#222',shirt:'#2b2f4a',pants:'#1c1f33',suit:1}:{skin:R(SK),hair:R(['none','short','long','bun']),hc:R(['#3b2a20','#222','#c98a3c','#a33']),shirt:R(CL),pants:'#4a5a8a'};
 const el=document.createElement('div');el.className='c';el.dataset.id=nid;
 el.innerHTML=`${vip?'<div class="lab">⭐ VIP</div>':''}<div class="tm"><i style="width:100%"></i><b>${t}s</b></div><div class="bub">${candy(o,18)}</div><div class="bob">${person(l,64,4)}</div>`;
 el.style.left='-90px';cc.appendChild(el);void el.offsetWidth;
 const x=slotX(free),d=(x+90)/130,c={id:nid++,el,slot:free,state:'enter',o,vip,t,tmax:t};
 el.style.transition=`left ${d}s linear`;el.style.left=x+'px';el.classList.add('walking');cu.push(c);
 setTimeout(()=>{if(c.state==='enter'){c.state='wait';el.classList.remove('walking')}},d*1000);hud();return true}
function leave(c,happy){c.state='leave';const el=c.el;el.querySelector('.bub').innerHTML=happy?candy(c.o,18):'💢';el.querySelector('.tm').style.display='none';const l=el.querySelector('.lab');if(l)l.style.display='none';
 const d=(1100-parseFloat(el.style.left))/190;el.classList.add('walking');el.style.transition=`left ${d}s linear`;el.style.left='1100px';
 setTimeout(()=>{el.remove();cu=cu.filter(k=>k!==c)},d*1000+200);hud()}
function tick(){if(paused)return;gt+=.2;
 cu.forEach(c=>{if(c.state!=='wait')return;c.t-=.2;const p=Math.max(0,c.t/c.tmax),i=c.el.querySelector('.tm i');
  i.style.width=p*100+'%';i.style.background=p>.5?'#4cd68a':p>.25?'#ffb347':'#ff5252';c.el.querySelector('.tm b').textContent=Math.ceil(Math.max(0,c.t))+'s';
  if(c.t<=0){const n=c.vip?3:1;S.c=Math.max(0,S.c-n);save();pop('-'+n+' ⭐','#d62839',c.el.offsetLeft,395);leave(c,false)}});
 if(gt>=nextSp){const vip=gt-lastVip>90&&Math.random()<.3;if(spawn(vip)){if(vip)lastVip=gt;nextSp=gt+9+Math.random()*7}else nextSp=gt+3}}
function give(c,k){
 if(k.state!=='wait')return;
 if(k.o!==c){say('They want '+k.o+'!',2000);k.el.classList.remove('no');void k.el.offsetWidth;k.el.classList.add('no');return}
 if(!S.stock[c])return;S.stock[c]--;const r=k.vip?5:1;S.c+=r;save();pop('+'+r+' ⭐','#1f8a3c',k.el.offsetLeft,395);leave(k,true)}
/* drag candy onto a customer */
let D=null;
document.getElementById('chips').addEventListener('pointerdown',e=>{const ch=e.target.closest('.chip');if(!ch||paused)return;const c=ch.dataset.c;
 if(!S.stock[c]){say('No '+c+' candy yet! Make some at the tray.',2500);return}D={c,x:e.clientX,y:e.clientY,moved:false,g:null};e.preventDefault()});
window.addEventListener('pointermove',e=>{if(!D)return;if(!D.moved&&Math.hypot(e.clientX-D.x,e.clientY-D.y)>10){D.moved=true;D.g=document.createElement('div');D.g.className='ghost';D.g.innerHTML=candy(D.c,42);document.body.appendChild(D.g)}
 if(D.g){D.g.style.left=e.clientX-21+'px';D.g.style.top=e.clientY-26+'px'}});
window.addEventListener('pointerup',e=>{if(!D)return;const d=D;D=null;if(d.g)d.g.remove();let k=null;
 if(d.moved){for(const x of document.elementsFromPoint(e.clientX,e.clientY)){const q=x.closest&&x.closest('.c');if(q){k=cu.find(z=>z.id==q.dataset.id);break}}
  if(k)give(d.c,k);else say('Drop the candy right on a customer!',2000)}
 else{k=cu.filter(q=>q.state==='wait'&&q.o===d.c).sort((a,b)=>a.t-b.t)[0];if(k)give(d.c,k);else say('Nobody ordered '+d.c+' right now.',2000)}});
window.addEventListener('pointercancel',()=>{if(D&&D.g)D.g.remove();D=null});
/* cabinet (far right) + silver tray (on the counter) */
function drawK(){
 const col=K.powder?HEX[K.powder]:null;
 let s=`<g class="hit" onclick="kCup()" style="cursor:pointer"><rect x="796" y="58" width="218" height="344" rx="12" fill="#a8643a" stroke="#6b3f23" stroke-width="6"/>`;
 if(!K.open)s+=`<rect x="806" y="68" width="98" height="324" rx="7" fill="#c8814f" stroke="#6b3f23" stroke-width="4"/><rect x="906" y="68" width="98" height="324" rx="7" fill="#c8814f" stroke="#6b3f23" stroke-width="4"/><circle cx="890" cy="230" r="8" fill="#ffd93d"/><circle cx="920" cy="230" r="8" fill="#ffd93d"/><text x="905" y="115" text-anchor="middle" font-size="26" fill="#5a2a54" font-family="Baloo 2,sans-serif">Powder</text><text x="905" y="142" text-anchor="middle" font-size="16" fill="#5a2a54" font-family="Baloo 2,sans-serif">tap to open</text>`;
 else{s+=`<rect x="806" y="68" width="198" height="324" rx="7" fill="#6b3f23"/>`;
  COLS.forEach(([n,h],i)=>{const x=822+(i%2)*92,y=96+(i>>1)*100,own=S.cols.includes(n);s+=`<rect x="808" y="${y+66}" width="194" height="9" fill="#a8643a"/>`;
   if(own)s+=`<g onclick="event.stopPropagation();kJar('${n}')" style="cursor:pointer"><rect x="${x}" y="${y}" width="66" height="62" rx="12" fill="${h}" stroke="#fff" stroke-width="3"/><rect x="${x+8}" y="${y-11}" width="50" height="13" rx="4" fill="#e8eef2"/><circle cx="${x+18}" cy="${y+20}" r="6" fill="#fff8"/></g>`;
   else s+=`<rect x="${x}" y="${y}" width="66" height="62" rx="12" fill="none" stroke="#ffffff66" stroke-width="2" stroke-dasharray="6 5"/><text x="${x+33}" y="${y+40}" text-anchor="middle" font-size="24">🔒</text>`})}
 s+=`</g><ellipse cx="${CX}" cy="${CY+8}" rx="126" ry="34" fill="#9aa5ad"/><ellipse cx="${CX}" cy="${CY+3}" rx="122" ry="33" fill="#d3dbe1"/><ellipse cx="${CX}" cy="${CY+5}" rx="106" ry="25" fill="#eef3f6" stroke="#8c98a1" stroke-width="3"/><ellipse cx="${CX-46}" cy="${CY-1}" rx="26" ry="4" fill="#fff" opacity=".8"/>`;
 if(col){
  s+=`<ellipse cx="${CX}" cy="${CY+8}" rx="${70-K.prog*22}" ry="${15-K.prog*4}" fill="${col}" stroke="#0002"/>`;
  const a=K.a,sx=CX+Math.cos(a)*96,sy=CY+5+Math.sin(a)*19,r=10+K.prog*30,mx=CX+Math.cos(a)*54,my=CY+3+Math.sin(a)*10-r*.6;
  s+=`<line x1="${CX}" y1="${CY+5}" x2="${sx}" y2="${sy}" stroke="#e8c9a0" stroke-width="7" stroke-linecap="round"/>`;
  if(K.prog>0)s+=`<g fill="${col}" stroke="#0002"><circle cx="${mx}" cy="${my}" r="${r}"/><circle cx="${mx-r*.6}" cy="${my+r*.3}" r="${r*.7}"/><circle cx="${mx+r*.6}" cy="${my+r*.3}" r="${r*.7}"/><circle cx="${mx}" cy="${my-r*.6}" r="${r*.6}"/></g><circle cx="${mx-r*.3}" cy="${my-r*.3}" r="${r*.3}" fill="#fff8"/>`;
  s+=`<rect x="500" y="352" width="180" height="14" rx="7" fill="#fff" stroke="#5a2a54" stroke-width="2"/><rect x="501" y="353" width="${178*K.prog}" height="12" rx="6" fill="${col}"/>`}
 s+=`<ellipse class="hit" id="trayhit" cx="${CX}" cy="${CY+4}" rx="140" ry="44" fill="transparent"/>`;
 ks.innerHTML=s}
function kCup(){goTo('cupboard',()=>{K.open=!K.open;drawK()})}
function kJar(c){K.powder=c;K.prog=0;K.drag=false;K.open=false;drawK();say('Taking the powder to the tray... 🌀');goTo('tray',()=>say('Spin your finger around the silver tray!'))}
ks.addEventListener('pointerdown',e=>{if(!e.target.closest('#trayhit'))return;const[x,y]=toL(e);
 if(!isAt('tray')||auto){goTo('tray');say('Walking to the tray...',1500);return}
 if(!K.powder){say('Get powder from the cabinet first! 👉',2500);return}
 K.drag=true;K.last=Math.atan2((y-CY)*3.2,x-CX);ks.setPointerCapture(e.pointerId)});
ks.addEventListener('pointermove',e=>{if(!K.drag||!K.powder||paused)return;const[x,y]=toL(e),a=Math.atan2((y-CY)*3.2,x-CX);let d=a-K.last;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;
 K.last=a;K.a=a;K.prog+=Math.abs(d)/(2*Math.PI*SPIN[S.spin]);
 if(K.prog>=1){S.stock[K.powder]++;save();pop('🍭 Candy ready!','#d6246e',520,230);K.powder=null;K.prog=0;K.drag=false;hud();say('Nice! Now drag it onto a customer. 🏪',3000)}
 drawK()});
['pointerup','pointercancel'].forEach(t=>ks.addEventListener(t,()=>K.drag=false));
/* shop menu */
function sw(t,c){return t==='a'?`<svg width="44" height="44" viewBox="0 0 44 44"><rect x="8" y="4" width="28" height="36" rx="8" fill="${c}" stroke="#0003"/></svg>`:
 c?`<svg width="48" height="44" viewBox="0 0 60 30"><g fill="${c}" stroke="#0003"><circle cx="18" cy="12" r="9"/><circle cx="42" cy="12" r="9"/><circle cx="30" cy="8" r="10"/><rect x="16" y="14" width="28" height="12" rx="3"/></g></svg>`:'<div style="height:44px;line-height:44px">none</div>'}
function cos(list,t){return list.map(([id,c,cost])=>{const own=S.own.includes(t+':'+id),on=S[t]===id;
 return `<div class="it ${on?'on':''}">${sw(t,c)}<div>${id}</div><button onclick="pickIt('${t}','${id}',${cost})">${on?'Wearing ✓':own?'Wear':'Buy '+cost+' ⭐'}</button></div>`}).join('')}
function upgrades(){let h='';
 ['green','purple','white'].forEach(n=>{const own=S.cols.includes(n);h+=`<div class="it">${candy(n,26)}<div>${n} candy</div><button ${own?'disabled':''} onclick="buy('col','${n}',${COLP[n]})">${own?'In cabinet ✓':'Buy '+COLP[n]+' ⭐'}</button></div>`});
 h+=`<div class="it"><div style="font-size:28px">🌀</div><div>Faster spinning</div><button ${S.spin>1?'disabled':''} onclick="buy('spin','',${SPINP[S.spin]||0})">${S.spin>1?'Max ✓':'Level '+(S.spin+1)+': '+SPINP[S.spin]+' ⭐'}</button></div>`;
 h+=`<div class="it"><div style="font-size:28px">⏳</div><div>Patience +10s</div><button ${S.pat>1?'disabled':''} onclick="buy('pat','',${PATP[S.pat]||0})">${S.pat>1?'Max ✓':'Level '+(S.pat+1)+': '+PATP[S.pat]+' ⭐'}</button></div>`;return h}
function buy(k,n,cost){if(S.c<cost){alert('You need '+cost+' ⭐ tokens. Keep selling cotton candy!');return}S.c-=cost;
 if(k==='col')S.cols.push(n);else S[k]++;save();hud();drawK();openShop()}
function pickIt(t,id,cost){const key=t+':'+id;
 if(!S.own.includes(key)){if(S.c<cost){alert('You need '+cost+' ⭐ tokens. Keep selling cotton candy!');return}S.c-=cost;S.own.push(key)}
 S[t]=id;save();hud();drawMe();openShop()}
function openShop(){paused=true;document.getElementById('tk').textContent='You have ⭐ '+S.c+'  (game paused)';
 document.getElementById('ug').innerHTML=upgrades();document.getElementById('ag').innerHTML=cos(APR,'a');document.getElementById('hg').innerHTML=cos(HAT,'h');
 document.getElementById('shop').classList.remove('hide')}
function shopX(){paused=false;document.getElementById('shop').classList.add('hide')}
function swap(){S.g=S.g==='girl'?'boy':'girl';save();drawMe()}
function begin(g){S.g=g;save();document.getElementById('start').classList.add('hide');paused=false;fit();me_.style.transition='none';setP(430,100);drawMe();drawK();hud();hint();gt=0;nextSp=1;lastVip=0}
document.getElementById('pg').innerHTML=meSvg('girl','#ff7eb6',null,70);
document.getElementById('pb').innerHTML=meSvg('boy','#ff7eb6',null,70);
fit();setInterval(tick,200);
if(S.g){begin(S.g)}
</script>
</body>
</html>
