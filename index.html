<style>
:root{--bg:#fff3b0;--ink:#5a2a54}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;position:fixed;background:var(--bg);color:var(--ink);font-family:'Baloo 2','Trebuchet MS',sans-serif;font-weight:700;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0}
#stage{position:fixed;inset:0;touch-action:none}
#scene{position:absolute;left:0;top:0;width:1024px;height:720px;transform-origin:0 0;overflow:hidden;background:repeating-linear-gradient(90deg,#b9e6ff 0 48px,#dff3ff 48px 96px)}
#scene>*{position:absolute}
.floor{left:0;top:262px;width:1024px;height:458px;background:#b79cff;z-index:0}
#shelf{left:20px;top:58px;width:620px;height:70px;background:repeating-linear-gradient(0deg,#0000 0 6px,#0001 6px 8px),linear-gradient(#a9743f,#8a5a2b);border:4px solid #6b3f23;border-radius:8px;z-index:1}
#shelf::after{content:"";position:absolute;left:-8px;right:-8px;bottom:-10px;height:16px;background:#6b3f23;border-radius:5px;box-shadow:0 4px 0 #0003}
.si{position:absolute;top:8px;width:94px;height:50px;display:flex;align-items:center;gap:6px;padding-left:10px;font-size:19px;color:#fff;text-shadow:0 2px 0 #4b2a10;touch-action:none;cursor:grab}
.lock{position:absolute;top:18px;width:94px;text-align:center;font-size:20px;opacity:.35}
.ctop{left:0;top:196px;width:780px;height:40px;background:#ffc2df;border-radius:0 18px 0 0;z-index:2}
.cfront{left:0;top:232px;width:780px;height:36px;background:#ff9ecf;border-bottom:6px solid #d9609c;z-index:2}
.awn{left:0;top:0;width:1024px;height:50px;background:repeating-linear-gradient(90deg,#ff5fa2 0 40px,#fff 40px 80px);border-radius:0 0 22px 22px;z-index:5}
#ksvg{left:0;top:0;width:1024px;height:720px;z-index:3;pointer-events:none}
.hit{pointer-events:auto}
#me,#cash,#wind{width:64px;z-index:1}
#me{touch-action:none;cursor:grab}
#cash,#wind{display:none}
.wp{position:absolute;top:-20px;left:6px;width:52px;height:10px;background:#fff;border:2px solid #5a2a54;border-radius:6px;overflow:hidden}
.wp i{display:block;height:100%;width:0;background:#ff7eb6}
.till{width:72px;height:56px;top:168px;z-index:3;cursor:pointer}
.till .lamp{fill:#999}.till.on .lamp{fill:#2ee66b}
#t2{display:none}
#cc{left:0;top:0;width:1024px;height:720px;pointer-events:none;z-index:4}
.c{position:absolute;width:52px;height:92px;pointer-events:auto}
.bob{display:block}
.walking .bob{animation:bob .32s infinite alternate ease-in-out}
@keyframes bob{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-5px) rotate(2deg)}}
.lbl{position:absolute;left:54px;top:6px;display:flex;align-items:center;gap:4px;background:#fff;border:2px solid #5a2a54;border-radius:10px;padding:1px 6px;font-size:12px;white-space:nowrap}
.lbl.vip{background:#ffe27a;border-color:#b8860b}
.tm{position:relative;width:46px;height:13px;background:#eee;border-radius:7px;overflow:hidden;border:1px solid #5a2a54}
.tm i{position:absolute;left:0;top:0;bottom:0;background:#4cd68a;transition:width .2s linear}
.tm b{position:relative;font-size:10px;line-height:11px;display:block;text-align:center}
.c.no{animation:sh .35s}
@keyframes sh{25%{margin-left:-8px}75%{margin-left:8px}}
.pop{z-index:8;font-size:26px;pointer-events:none;white-space:nowrap;animation:up 1.2s forwards;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.hud{top:7px;z-index:7;display:flex;align-items:center;gap:8px;height:38px}
.pill{background:#fff;border-radius:20px;padding:0 14px;font-size:19px;line-height:36px;height:38px;box-shadow:0 3px 0 #e9c46a;white-space:nowrap}
.pill.rush{background:#ff4d4d;color:#fff;box-shadow:0 3px 0 #a31d1d;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.btn{background:#fff;border-radius:16px;padding:4px 14px;box-shadow:0 4px 0 #e9a8c8}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #e9a8c8}
#orders{right:12px;top:6px;background:#fff;border:3px solid #ff7eb6;border-radius:12px;padding:0 10px;z-index:7;display:flex;align-items:center;gap:8px;font-size:16px;height:40px}
#orders i{display:flex;align-items:center;gap:2px;font-style:normal}
#hint{left:742px;bottom:12px;width:270px;height:84px;font-size:16px;line-height:19px;z-index:6;overflow:hidden;color:#fff;text-shadow:0 2px 0 #5a2a54;text-align:right}
#banner{left:0;right:0;top:250px;z-index:9;text-align:center;font-size:96px;font-weight:800;color:#fff;text-shadow:0 6px 0 #c01616,0 0 24px #ff4d4d;pointer-events:none;display:none;animation:ban 3.2s forwards}
@keyframes ban{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.15);opacity:1}25%{transform:scale(1)}85%{opacity:1}100%{transform:scale(1.1);opacity:0}}
.ghost{position:fixed;z-index:50;pointer-events:none}
.ov{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;padding:30px 14px;text-align:center}
.ov.hide{display:none}
.pick{display:flex;justify-content:center;gap:16px;margin-top:14px}
.pick button{background:#fff;border-radius:22px;padding:12px 18px;font-size:22px;box-shadow:0 6px 0 #e9a8c8}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0 16px}
.it{background:#fff;border-radius:16px;padding:8px;width:136px;font-size:15px}
.it.rushit{background:#ffd0d0;outline:3px solid #ff4d4d}
.it button{margin-top:4px;border-radius:12px;padding:2px 8px;background:#ffd93d}
.it.on button{background:#9be28f}
.it button:disabled{background:#ddd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff3b0}}
:root[data-theme="dark"]{--bg:#fff3b0}
</style>
</head>
<body>
<div id="stage"><div id="scene"><div class="floor"></div><div id="shelf"></div><div class="ctop"></div><div class="cfront"></div><div class="awn"></div>
<svg id="ksvg" viewBox="0 0 1024 720"></svg>
<div id="me"></div><div id="cash"></div><div id="wind"></div>
<div class="till" id="t1" onclick="goTo('till1')"></div><div class="till" id="t2" onclick="goTo('till2')"></div>
<div id="cc"></div>
<div class="hud" style="left:12px"><span class="pill">🍭 Cotton Candy</span><span class="pill" id="coin">⭐ 0</span><span class="pill" id="rush">⏱</span><button class="btn" style="font-size:19px" onclick="openShop()">🛍️ Shop</button></div>
<div id="orders"></div><div id="hint"></div><div id="banner">🚨 RUSH HOUR! 🚨</div></div></div>

<div class="ov" id="start"><h1 style="font-size:36px;margin:20px 0 6px">🍭 Cotton Candy Shop</h1><p style="font-size:22px">Pick your character!</p><div class="pick"><button onclick="begin('girl')"><div id="pg"></div>Girl</button><button onclick="begin('boy')"><div id="pb"></div>Boy</button></div></div>
<div class="ov hide" id="shop"><h2 style="margin:6px">Shop</h2><div id="tk" style="font-size:20px"></div>
<div id="rushsec"></div><h3>Upgrades</h3><div class="grid" id="ug"></div><h3>Hire helpers</h3><div class="grid" id="hire"></div><h3>Aprons</h3><div class="grid" id="ag"></div><h3>Chef hats</h3><div class="grid" id="hg"></div>
<button class="btn" onclick="swap()">Switch girl / boy</button> <button class="btn" onclick="shopX()">Back to the game 🍭</button></div>

<script>
const COLS=[['pink','#ff7eb6'],['blue','#5ab8ff'],['yellow','#ffd93d'],['green','#4cd68a'],['purple','#b07cff'],['white','#ffffff']],HEX=Object.fromEntries(COLS);
const PAY={pink:1,blue:1,yellow:1,green:2,purple:3,white:4};
const APR=[['pink','#ff7eb6',0],['blue','#4aa8f5',10],['yellow','#ffd93d',10],['purple','#9b6bd6',10]];
const HAT=[['none',null,0],['white','#ffffff',15],['pink','#ff9ecf',15],['blue','#7cc4ff',15],['yellow','#ffe066',15]];
const COLP={green:15,purple:25,white:40},SPIN=[3,2,1.5],SPINP=[20,40],PATP=[30,50],WT=[7,5.5,4.5];
const SK=['#f6d3b3','#e0ac84','#b97a56','#8d5a3b'],CL=['#e85d75','#4f9bd9','#6cc070','#f08c3a','#2bb3a8','#d94f4f','#ffd93d'];
const MAXL=7,TX={1:190,2:610},slotTop=i=>240+i*62;
const R_=a=>a[Math.random()*a.length|0];
let S={c:0,g:null,a:'pink',h:'none',own:['a:pink','h:none'],cols:['pink','blue','yellow'],spin:0,pat:0,cashier:false,winder:false,stock:{pink:0,blue:0,yellow:0,green:0,purple:0,white:0}};
try{const x=JSON.parse(localStorage.getItem('ccshop3'));if(x){const st=Object.assign({},S.stock,x.stock);S=Object.assign(S,x);S.stock=st}}catch(e){}
function save(){try{localStorage.setItem('ccshop3',JSON.stringify(S))}catch(e){}}
const sc=document.getElementById('scene'),me_=document.getElementById('me'),ks=document.getElementById('ksvg'),cc=document.getElementById('cc'),$=id=>document.getElementById(id);
let sf=1,cu=[],nid=0,gt=0,nextSp=1,lastVip=0,paused=true,auto=false,mv=0,cashT=0,windT=0,windCol=null;
const RU={on:false,t:300,cash:false,wind:false};
const hasCash=()=>S.cashier||RU.cash,hasWind=()=>S.winder||RU.wind;
const K={powder:null,prog:0,open:false,drag:false,last:0,a:0},P={x:158,y:92},CX=400,CY=214;
const STN={till1:[158,92],tray:[368,92],till2:[578,92],cupboard:[735,92]};
function fit(){const w=innerWidth,h=innerHeight;sf=Math.min(w/1024,h/720);sc.style.transform=`translate(${(w-1024*sf)/2}px,${(h-720*sf)/2}px) scale(${sf})`}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
const toL=e=>{const r=sc.getBoundingClientRect();return[(e.clientX-r.left)/sf,(e.clientY-r.top)/sf]};
function person(o,w,top){
 const hc=o.hc||'#3b2a20',h=o.hair,L='stroke="#5a2a54" stroke-opacity=".5"';
 let s=`<svg width="${w}" viewBox="0 ${top} 60 ${110-top}" style="display:block">`;
 s+=`<rect x="18" y="84" width="9" height="24" rx="3" fill="${o.pants}"/><rect x="33" y="84" width="9" height="24" rx="3" fill="${o.pants}"/>`;
 s+=`<rect x="12" y="44" width="36" height="44" rx="10" fill="${o.shirt}" ${L}/><rect x="4" y="48" width="9" height="30" rx="4" fill="${o.shirt}" ${L}/><rect x="47" y="48" width="9" height="30" rx="4" fill="${o.shirt}" ${L}/>`;
 if(o.suit)s+=`<path d="M24 44l6 16 6-16z" fill="#fff"/><path d="M29 50h2l2 14-3 4-3-4z" fill="#d62839"/><path d="M12 50l12-6 6 16-10 10z M48 50l-12-6-6 16 10 10z" fill="#1c1f33" opacity=".45"/>`;
 if(o.apron)s+=`<rect x="16" y="54" width="28" height="36" rx="6" fill="${o.apron}" ${L}/>`;
 if(h==='long')s+=`<rect x="12" y="22" width="8" height="32" rx="4" fill="${hc}"/><rect x="40" y="22" width="8" height="32" rx="4" fill="${hc}"/>`;
 s+=`<circle cx="30" cy="26" r="16" fill="${o.skin}" stroke="#5a2a54" stroke-width="1.5"/>`;
 if(h!=='none')s+=`<path d="M13 28a17 17 0 0 1 34 0q-17-9-34 0z" fill="${hc}"/>`;
 if(h==='bun')s+=`<circle cx="30" cy="8" r="7" fill="${hc}"/>`;
 if(o.hat)s+=`<g fill="${o.hat}" stroke="#0004"><circle cx="20" cy="2" r="9"/><circle cx="40" cy="2" r="9"/><circle cx="30" cy="-4" r="10"/><rect x="18" y="4" width="24" height="10" rx="3"/></g>`;
 return s+'</svg>';
}

 if(n==='till2'&&!hasCash())return;
 if(isAt(n)&&!auto){cb&&cb();return}
 const[x,y]=STN[n],t=++mv,d=Math.max(.3,Math.hypot(x-P.x,y-P.y)/420);auto=true;
 me_.style.transition=`left ${d}s linear,top ${d}s linear`;me_.style.left=x+'px';me_.style.top=y+'px';me_.classList.add('walking');
 setTimeout(()=>{if(t!==mv)return;auto=false;me_.style.transition='none';me_.classList.remove('walking');setP(x,y);cb&&cb()},d*1000)}

me_.addEventListener('pointerdown',e=>{if(paused)return;mv++;auto=false;const[lx,ly]=toL(e),cs=getComputedStyle(me_);
 setP(parseFloat(cs.left)||P.x,parseFloat(cs.top)||P.y);me_.style.transition='none';me_.classList.remove('walking');
 dragP=[lx-P.x,ly-P.y];me_.setPointerCapture(e.pointerId);e.preventDefault()});
me_.addEventListener('pointermove',e=>{if(!dragP)return;const[lx,ly]=toL(e),[x,y]=clampP(lx-dragP[0],ly-dragP[1]);
 if(Math.hypot(x-P.x,y-P.y)>1)me_.classList.add('walking');setP(x,y)});
['pointerup','pointercancel'].forEach(t=>me_.addEventListener(t,()=>{dragP=null;me_.classList.remove('walking')}));

 el.innerHTML=`<div class="bob">${person(l,52,4)}</div><div class="lbl ${vip?'vip':''}">${vip?'<b>⭐VIP</b>':''}${candy(o,15)}<span class="tm"><i style="width:100%"></i><b>${T}s</b></span></div>`;
 el.style.left='-90px';el.style.top=slotTop(idx)+'px';el.style.zIndex=10+idx;cc.appendChild(el);void el.offsetWidth;

 el.style.zIndex=2;const d=(1100-parseFloat(el.style.left))/200;el.classList.add('walking');el.style.transition=`left ${d}s linear,top .6s ease`;el.style.left='1100px';

/* rush hour */

function tick(){if(paused)return;gt+=.2;RU.t-=.2;if(RU.t<=0)RU.on?endRush():startRush();
 cu.forEach(c=>{if(c.state!=='wait')return;c.t-=.2;const p=Math.max(0,c.t/c.tmax),i=c.el.querySelector('.tm i');
  i.style.width=p*100+'%';i.style.background=p>.5?'#4cd68a':p>.25?'#ffb347':'#ff5252';c.el.querySelector('.tm b').textContent=Math.ceil(Math.max(0,c.t))+'s';
  if(c.t<=0){const n=c.vip?3:1;S.c=Math.max(0,S.c-n);save();pop('-'+n+' ⭐','#d62839',parseFloat(c.el.style.left)+30,parseFloat(c.el.style.top)-8);leave(c,false)}});
 if(gt>=nextSp){const vip=gt-lastVip>80&&Math.random()<.25;if(spawn(vip)){if(vip)lastVip=gt;nextSp=gt+(RU.on?1.2+Math.random()*1.6:4+Math.random()*4)}else nextSp=gt+1.2}
 if(hasCash()){cashT+=.2;if(cashT>=2.4){cashT=0;const k=line(2).filter(c=>c.state==='wait'&&S.stock[c.o]>0).sort((a,b)=>a.t-b.t)[0];if(k)finish(k)}}
 if(hasWind()){windT+=.2;const w=WT[S.spin];if(!windCol){const need={};line(1).concat(line(2)).forEach(c=>need[c.o]=(need[c.o]||0)+1);
   let best=null,bs=-99;S.cols.forEach(c=>{const sc_=(need[c]||0)-S.stock[c];if(sc_>bs){bs=sc_;best=c}});
   if(bs<=0){best=S.cols.slice().sort((a,b)=>S.stock[a]-S.stock[b])[0];if(S.stock[best]>=6)best=null}windCol=best;windT=0}
  const pi=$('wpi');if(pi){pi.style.width=(windCol?windT/w*100:0)+'%';pi.style.background=windCol?HEX[windCol]:'#fff'}
  if(windCol&&windT>=w){S.stock[windCol]++;save();pop('🍭','#d6246e',515,60);windCol=null;windT=0;hud()}}
 hud()}
